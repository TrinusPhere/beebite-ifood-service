# =============================================================================
# Bitbucket Pipelines — biteflow-ifood-service (Quarkus Native + GCP Registry)
# =============================================================================
# Variáveis necessárias em Repository Settings -> Repository variables:
#   GCP_PROJECT_ID      : biteflow-prd
#   GCP_REGION          : us-east1
#   GCP_SA_KEY_BASE64   : (chave JSON da Service Account de CI em base64)
# =============================================================================
image: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

definitions:
  caches:
    maven: ~/.m2/repository

pipelines:
  custom:
    deploy-native-prd:
      - step:
          name: Build Quarkus Native & Push to GCP Artifact Registry
          size: 2x # 8GB RAM necessários para compilação GraalVM Native
          services:
            - docker
          caches:
            - maven
          script:
            - chmod +x mvnw
            - ./mvnw package -Dnative -DskipTests -Dquarkus.native.native-image-xmx=5g
            - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/tmp
            - export PATH="/tmp/google-cloud-sdk/bin:$PATH"
            - echo "$GCP_SA_KEY_BASE64" | base64 -d > /tmp/gcp-key.json
            - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
            - gcloud auth configure-docker ${GCP_REGION:-us-east1}-docker.pkg.dev --quiet
            - IMAGE_URI="${GCP_REGION:-us-east1}-docker.pkg.dev/${GCP_PROJECT_ID:-biteflow-prd}/biteflow-repo/biteflow-ifood-service"
            - docker build -f src/main/docker/Dockerfile.native -t "${IMAGE_URI}:${BITBUCKET_COMMIT::7}" -t "${IMAGE_URI}:latest" .
            - docker push "${IMAGE_URI}:${BITBUCKET_COMMIT::7}"
            - docker push "${IMAGE_URI}:latest"
            - rm -f /tmp/gcp-key.json

