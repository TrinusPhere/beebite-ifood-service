# =============================================================================
# Bitbucket Pipelines — beebite-ifood-service (Quarkus Native + GCP Registry)
# =============================================================================
# Variáveis necessárias em Repository Settings -> Repository variables:
#   GCP_PROJECT_ID      : beebite-prd
#   GCP_REGION          : us-east1
#   GCP_SA_KEY_BASE64   : (chave JSON da Service Account de CI em base64)
# =============================================================================
image: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

definitions:
  caches:
    maven: ~/.m2/repository
  steps:
    - step: &deploy-native
        name: Build Quarkus Native & Push to GCP Artifact Registry
        size: 2x
        services:
          - docker
        caches:
          - maven
        script:
          - bash mvnw package -Dnative -DskipTests -Dquarkus.native.native-image-xmx=5g
          - echo "$GCP_SA_KEY_BASE64" | base64 -d | docker login -u _json_key --password-stdin https://${GCP_REGION:-us-east1}-docker.pkg.dev
          - IMAGE_URI="${GCP_REGION:-us-east1}-docker.pkg.dev/${GCP_PROJECT_ID:-beebite-prd}/beebite-repo/beebite-ifood-service"
          - docker build -f src/main/docker/Dockerfile.native -t "${IMAGE_URI}:${BITBUCKET_COMMIT::7}" -t "${IMAGE_URI}:latest" .
          - docker push "${IMAGE_URI}:${BITBUCKET_COMMIT::7}"
          - docker push "${IMAGE_URI}:latest"

pipelines:
  branches:
    main:
      - step: *deploy-native
    master:
      - step: *deploy-native
  custom:
    deploy-native-prd:
      - step: *deploy-native

