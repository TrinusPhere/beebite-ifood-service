# ── Database ──
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:biteflow_ifood}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}

# Dev: Postgres persistente (WSL2, localhost:5432), igual ao backend — evita o Dev Services descartável.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:biteflow_ifood}
%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:postgres}

quarkus.hibernate-orm.database.generation=none

# ── Flyway ──
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# ── HTTP ──
quarkus.http.port=8081
quarkus.http.root-path=/

# ── Google Cloud Pub/Sub ──
quarkus.google.cloud.project-id=${GCP_PROJECT_ID:biteflow-dev}
# Emulador (ambiente local)
%dev.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%dev.quarkus.google.cloud.pubsub.use-plaintext=true
%test.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%test.quarkus.google.cloud.pubsub.use-plaintext=true

# ── iFood API ──
biteflow.ifood.base-url=${IFOOD_BASE_URL:https://merchant-api.ifood.com.br}
biteflow.ifood.encryption-key=${IFOOD_ENCRYPTION_KEY:BtFl0w-Enc-K3y-32-chars-secret!}
biteflow.ifood.polling-interval=30s
%dev.quarkus.scheduler.enabled=true

# ── Logging ──
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
%dev.quarkus.log.level=INFO
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.file.enable=true
%dev.quarkus.log.file.path=logs/ifood-service.log
%dev.quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
%dev.quarkus.log.file.rotation.max-file-size=10M
%dev.quarkus.log.file.rotation.max-backup-index=5
%test.quarkus.log.file.enable=false
