# ── Database ──
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5434/${DB_NAME:biteflow_ifood}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.hibernate-orm.database.generation=none

# ── Flyway ──
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ── HTTP ──
quarkus.http.port=8081
quarkus.http.root-path=/

# ── Google Cloud Pub/Sub ──
quarkus.google.cloud.project-id=${GCP_PROJECT_ID:biteflow-dev}
# Emulador (ambiente local)
%dev.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%dev.quarkus.google.cloud.pubsub.use-plaintext=true
%test.quarkus.google.cloud.pubsub.endpoint=localhost:8085
%test.quarkus.google.cloud.pubsub.use-plaintext=true

# ── iFood API ──
biteflow.ifood.base-url=${IFOOD_BASE_URL:https://merchant-api.ifood.com.br}
biteflow.ifood.encryption-key=${IFOOD_ENCRYPTION_KEY:BtFl0w-Enc-K3y-32-chars-secret!}
biteflow.ifood.polling-interval=30s

# ── Logging ──
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
%dev.quarkus.log.level=DEBUG
%dev.quarkus.hibernate-orm.log.sql=true
